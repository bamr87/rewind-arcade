name: emulate

on:
  # Branch pushes are covered by pull_request; without this filter every
  # commit on a PR branch ran the whole workflow twice.
  push:
    branches: [main]
    paths:
      - "emulate/**"
      - "bin/retropi"
      - ".github/workflows/emulate.yml"
  pull_request:
    paths:
      - "emulate/**"
      - "bin/retropi"
      - ".github/workflows/emulate.yml"
  workflow_dispatch:

# A newer commit on the same PR supersedes the in-flight run. Runs on main
# are never cancelled, so every merge keeps its arm64 result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite runs in minutes. Without a cap, the hang this pillar documents
    # (a captured subprocess that blocks on stdin) holds a runner for GitHub's
    # 6-hour default before anyone is billed the bad news.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS (stock bash 3.2) runs only on manual dispatch. macOS minutes
        # bill at 10x against the private-repo Actions allowance, and that
        # allowance running out blocked every private repo in the fleet from
        # 2026-09-14 to 09-30 (bamr87/bamr87#268). Run the bash 3.2 leg before
        # a release, or after touching bash-3.2-sensitive code:
        #   gh workflow run emulate.yml -R bamr87/rewind-arcade --ref <branch>
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["macos-latest", "ubuntu-latest"]') || fromJSON('["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: emulate
    steps:
      - uses: actions/checkout@v7

      - name: Report shell and python
        run: |
          bash --version | head -1
          python3 --version
          python3 -c 'import yaml' 2>/dev/null && echo "PyYAML: present" || echo "PyYAML: absent"

      - name: Validate every manifest
        run: ./bin/retropi config validate

      # Skipped on macOS: the validator probes the local `bash` for the Bash
      # Debug extension (needs bash >= 4), and a macOS runner's PATH bash is
      # Apple's 3.2. That stock bash is exactly what this leg is meant to
      # test, so the check can never pass there. It is a developer-machine
      # check, not a config defect. The same static checks still run on Linux.
      - name: Validate the .vscode run/debug configuration
        if: runner.os != 'macOS'
        run: python3 tools/validate-vscode.py

      - name: Run the test suite
        run: ./tests/run.sh

      - name: Run the suite with the built-in YAML parser
        run: RETROPI_YAML_PURE=1 ./tests/run.sh

      - name: CLI smoke test
        run: |
          ./bin/retropi --version
          ./bin/retropi systems list
          ./bin/retropi build --no-install
          ./bin/retropi roms scan
          ./bin/retropi package --name ci-artifact

      - name: Verify the generated frontend config is valid XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          # ES-DE's dialect allows <loadExclusive/> beside the systemList root;
          # strip it so ElementTree sees a single-root document.
          xml = open('build/es_systems.xml').read().replace('<loadExclusive/>', '')
          root = ET.fromstring(xml)
          systems = root.findall('system')
          assert systems, "no systems generated"
          for s in systems:
              for tag in ('name', 'fullname', 'path', 'extension', 'platform'):
                  assert (s.findtext(tag) or '').strip(), f"{s.findtext('name')}: missing {tag}"
              assert s.findall('command'), f"{s.findtext('name')}: no launch command"
          print(f"ok: {len(systems)} systems, all elements present")
          PY

      - name: Verify the portable archive unpacks and runs
        run: |
          mkdir -p /tmp/unpack && tar -xzf dist/ci-artifact.tar.gz -C /tmp/unpack
          cd /tmp/unpack/ci-artifact
          ./bin/retropi --version
          ./bin/retropi systems list

      # Was a separate `lint` job. Billing rounds every job up to a whole
      # minute, so ~30 seconds of shellcheck on its own runner cost a full
      # minute on every push and pull request (plus its own checkout and an
      # apt install). It now reuses the checkout this job already did.
      # Linux only, as before: the apt install has no macOS equivalent.
      # Last in the job so a lint finding never hides a test result.
      - name: Lint (shellcheck)
        if: runner.os != 'macOS'
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck -S warning -x -e SC2034 bin/retropi lib/*.sh cmd/*.sh platforms/*/*.sh tools/*.sh
          shellcheck -S warning -x -e SC2034 tests/run.sh tests/lib/*.sh tests/test_*.sh

  raspberry-pi:
    name: raspberry pi (linux/arm64)
    # Still only on pushes to main and manual dispatch, as when this job cost
    # ~32 minutes a run. To check a branch before merging:
    #   gh workflow run emulate.yml -R bamr87/rewind-arcade --ref <branch>
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    # A NATIVE arm64 runner, free for public repositories, instead of QEMU on
    # an amd64 one. Emulation was this workflow's whole cost: in run
    # 40143911318 the suite took 1831s of the job's 1950s, against 88s for the
    # same suite on amd64 — a ~21x emulation tax. Native arm64 removes it and
    # tests the real architecture, so the signal gets stronger, not weaker.
    # If this label is ever unavailable, the fallback is `ubuntu-latest` plus
    # `docker/setup-qemu-action` and `--platform linux/arm64` on both steps.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: emulate
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # `platforms:` is a no-op on a native arm64 host, but it is the thing
      # this job exists to assert — leave it, so a runner swap back to amd64
      # fails loudly instead of quietly testing the wrong architecture.
      # The Actions layer cache keeps the `apt-get install` layer, which sits
      # above `COPY . /retropi` and so only changes with the Dockerfile or the
      # base image, out of the per-commit build. `docker build` cannot read
      # that cache; buildx can.
      - name: Build the Pi-like image
        uses: docker/build-push-action@v7
        with:
          context: emulate
          file: emulate/docker/Dockerfile
          platforms: linux/arm64
          tags: retropi-test:arm64
          load: true
          cache-from: type=gha,scope=emulate-arm64
          cache-to: type=gha,mode=max,scope=emulate-arm64
      - name: Run the suite on arm64
        run: docker run --rm --platform linux/arm64 retropi-test:arm64

  debian-trixie:
    name: debian 13 trixie (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: emulate
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Same layer cache as the arm64 job, in its own scope so the two
      # architectures never evict each other.
      - name: Build the Debian 13 image
        uses: docker/build-push-action@v7
        with:
          context: emulate
          file: emulate/docker/Dockerfile
          build-args: DEBIAN=trixie
          tags: retropi-test:trixie
          load: true
          cache-from: type=gha,scope=emulate-trixie
          cache-to: type=gha,mode=max,scope=emulate-trixie
      - name: Run the suite on Debian 13
        run: docker run --rm retropi-test:trixie
