name: Deploy arcade to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "arcade/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcade
    steps:
      - uses: actions/checkout@v7

      # No lockfile (the fleet's always-latest policy): every deploy resolves the
      # newest versions package.json allows. No `cache: npm` either, since
      # setup-node fails when that is set and there is no lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      # Vendor EmulatorJS so the published site serves the emulator and its cores itself
      # rather than a CDN. Adds ~71 MB to the Pages artifact.
      - run: npm run emulatorjs

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: arcade/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
