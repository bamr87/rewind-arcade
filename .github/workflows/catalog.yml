name: catalog

on:
  # Branch pushes are covered by pull_request; without this filter every
  # commit on a PR branch ran the whole workflow twice (the same fix
  # emulate.yml already carries).
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "bin/cartidx"
      - ".github/workflows/catalog.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "bin/cartidx"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

# A newer commit on the same branch supersedes the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests and byte-compile
        run: make check
