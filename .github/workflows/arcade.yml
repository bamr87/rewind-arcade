name: arcade

on:
  push:
    paths:
      - "arcade/**"
      - ".github/workflows/arcade.yml"
  pull_request:
    paths:
      - "arcade/**"
      - ".github/workflows/arcade.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arcade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: arcade/package-lock.json
      - run: npm ci
      - run: npm run build
