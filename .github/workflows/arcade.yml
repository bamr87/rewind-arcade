name: arcade

on:
  # Branch pushes are covered by pull_request; without this filter every
  # commit on a PR branch ran the whole workflow twice (the same fix
  # emulate.yml already carries).
  push:
    branches: [main]
    paths:
      - "arcade/**"
      - ".github/workflows/arcade.yml"
  pull_request:
    paths:
      - "arcade/**"
      - ".github/workflows/arcade.yml"
  workflow_dispatch:

# A newer commit on the same branch supersedes the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arcade
    steps:
      - uses: actions/checkout@v7
      # No lockfile (the fleet's always-latest policy): every run resolves the
      # newest versions package.json allows. No `cache: npm` either, since
      # setup-node fails when that is set and there is no lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
