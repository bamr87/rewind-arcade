# Xbox Elite Series 2 over Bluetooth (045e:0b22) on the kernel's hid-microsoft
# driver. It reports 15 gamepad buttons, BTN_A..BTN_THUMBR including unused
# C, Z, TL2 and TR2, so its indices differ from both the USB (xpad) layout and
# RetroArch's bundled "Xbox Wireless Controller" BT profile, which would match
# by name and mis-map it. Axes: sticks X/Y and Z/RZ, triggers GAS (right) and
# BRAKE (left), D-pad on hat 0 - read from the device's capability bits; the
# button order matches SDL's controller database for this pad on Linux.
#
# The pad is only visible to RetroArch once udev tags it as a joystick; see
# platforms/steamos/xbox-bluetooth-joystick.hwdb. Installed by `retropi build`.
input_driver = "udev"
input_device = "Xbox Wireless Controller"
input_vendor_id = "1118"
input_product_id = "2850"
input_b_btn = "0"
input_a_btn = "1"
input_y_btn = "3"
input_x_btn = "4"
input_l_btn = "6"
input_r_btn = "7"
input_select_btn = "10"
input_start_btn = "11"
input_menu_toggle_btn = "12"
input_l3_btn = "13"
input_r3_btn = "14"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
input_l2_axis = "+5"
input_r2_axis = "+4"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"
