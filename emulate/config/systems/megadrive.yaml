# Sega Mega Drive / Genesis - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: megadrive
name: "Sega Mega Drive / Genesis"
short_name: "Genesis"
manufacturer: "Sega"
year: 1988
aliases: [genesis, md]

frontend:
  platform: megadrive   # scraper/theme id understood by ES-DE and RetroPie
  theme: megadrive

# File types the frontend will show for this system.
extensions: [".md", ".gen", ".smd", ".bin", ".zip", ".7z"]

emulators:
  default: genesis-plus-gx
  list:
    - id: genesis-plus-gx
      type: libretro
      core: genesis_plus_gx_libretro
      display: "Genesis Plus GX"
    - id: picodrive
      type: libretro
      core: picodrive_libretro
      display: "PicoDrive (fast)"
      platforms: [linux]

bios: []

notes: >-
  Genesis Plus GX also covers Master System, Game Gear, SG-1000 and Sega CD.
