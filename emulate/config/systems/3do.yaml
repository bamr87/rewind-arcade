# 3DO Interactive Multiplayer - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: 3do
name: "3DO Interactive Multiplayer"
short_name: "3DO"
manufacturer: "Panasonic"
year: 1993
aliases: [panasonic3do]

frontend:
  platform: 3do   # scraper/theme id understood by ES-DE and RetroPie
  theme: 3do

# File types the frontend will show for this system.
extensions: [".iso", ".bin", ".cue", ".chd"]

emulators:
  default: opera
  list:
    - id: opera
      type: libretro
      core: opera_libretro
      display: "Opera"

bios:
  - file: "panafz10.bin"
    required: true
    note: "Panasonic FZ-10 BIOS"

notes: >-
  Opera is the libretro 3DO core. A real FZ-10 BIOS is required.
