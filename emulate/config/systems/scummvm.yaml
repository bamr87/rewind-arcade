# ScummVM - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: scummvm
name: "ScummVM"
short_name: "ScummVM"
manufacturer: "Various"
year: 1987
aliases: [scumm]

frontend:
  platform: scummvm   # scraper/theme id understood by ES-DE and RetroPie
  theme: scummvm

# File types the frontend will show for this system.
extensions: [".scummvm", ".svm"]

emulators:
  default: scummvm
  list:
    - id: scummvm
      type: libretro
      core: scummvm_libretro
      display: "ScummVM"

bios: []

notes: >-
  Point-and-click adventure runtimes (LucasArts, Sierra, etc.). Each game folder needs a .scummvm stub the frontend can launch.
