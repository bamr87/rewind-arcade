# Mattel Intellivision - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: intellivision
name: "Mattel Intellivision"
short_name: "INTV"
manufacturer: "Mattel"
year: 1979
aliases: [intv]

frontend:
  platform: intellivision   # scraper/theme id understood by ES-DE and RetroPie
  theme: intellivision

# File types the frontend will show for this system.
extensions: [".int", ".bin", ".rom", ".zip", ".7z"]

emulators:
  default: freeintv
  list:
    - id: freeintv
      type: libretro
      core: freeintv_libretro
      display: "FreeIntv"

bios:
  - file: "exec.bin"
    required: true
    note: "Executive ROM"
  - file: "grom.bin"
    required: true
    note: "Graphics ROM"

notes: >-
  FreeIntv needs the two original firmware ROMs dumped from an Intellivision you own.
