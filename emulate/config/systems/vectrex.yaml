# GCE Vectrex - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: vectrex
name: "GCE Vectrex"
short_name: "Vectrex"
manufacturer: "GCE"
year: 1982
aliases: [gce]

frontend:
  platform: vectrex   # scraper/theme id understood by ES-DE and RetroPie
  theme: vectrex

# File types the frontend will show for this system.
extensions: [".vec", ".bin", ".zip", ".7z"]

emulators:
  default: vecx
  list:
    - id: vecx
      type: libretro
      core: vecx_libretro
      display: "vecx"

bios: []

notes: >-
  Vector display. Overlay images are not required to boot.
