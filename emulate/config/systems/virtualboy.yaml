# Nintendo Virtual Boy - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: virtualboy
name: "Nintendo Virtual Boy"
short_name: "VB"
manufacturer: "Nintendo"
year: 1995
aliases: [vb]

frontend:
  platform: virtualboy   # scraper/theme id understood by ES-DE and RetroPie
  theme: virtualboy

# File types the frontend will show for this system.
extensions: [".vb", ".vboy", ".zip", ".7z"]

emulators:
  default: mednafen-vb
  list:
    - id: mednafen-vb
      type: libretro
      core: mednafen_vb_libretro
      display: "Beetle VB"

bios: []

notes: >-
  Beetle VB emulates the dual-red display. A 3D mode exists; default is anaglyph-friendly red/black.
