# Atari 8-bit (400/800/XL/XE) - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: atari800
name: "Atari 8-bit (400/800/XL/XE)"
short_name: "Atari 8-bit"
manufacturer: "Atari"
year: 1979
aliases: [atarixl, atarixe]

frontend:
  platform: atari800   # scraper/theme id understood by ES-DE and RetroPie
  theme: atari800

# File types the frontend will show for this system.
extensions: [".xex", ".atr", ".atx", ".rom", ".bin", ".cas", ".zip"]

emulators:
  default: atari800
  list:
    - id: atari800
      type: libretro
      core: atari800_libretro
      display: "Atari800"

bios:
  - file: "ATARIOSB.ROM"
    required: false
    note: "OS-B"
  - file: "ATARIXL.ROM"
    required: false
    note: "XL/XE OS"

notes: >-
  Covers the 400/800/XL/XE line. The 5200 has its own system.
