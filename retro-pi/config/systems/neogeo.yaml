# SNK Neo Geo - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: neogeo
name: "SNK Neo Geo"
short_name: "Neo Geo"
manufacturer: "SNK"
year: 1990
aliases: []

frontend:
  platform: neogeo   # scraper/theme id understood by ES-DE and RetroPie
  theme: neogeo

# File types the frontend will show for this system.
extensions: [".zip", ".7z"]

emulators:
  default: fbneo
  list:
    - id: fbneo
      type: libretro
      core: fbneo_libretro
      display: "FinalBurn Neo"

# Checked by `retropi doctor --bios`. retro-pi never downloads BIOS files;
# you must supply them from hardware you own.
bios:
  - file: "neogeo.zip"
    required: true
    note: "BIOS set; must match your romset version"

notes: >-
  Neo Geo needs a neogeo.zip BIOS whose version matches your romset.
