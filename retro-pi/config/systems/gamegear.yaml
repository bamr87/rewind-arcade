# Sega Game Gear - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: gamegear
name: "Sega Game Gear"
short_name: "GG"
manufacturer: "Sega"
year: 1990
aliases: [gg]

frontend:
  platform: gamegear   # scraper/theme id understood by ES-DE and RetroPie
  theme: gamegear

# File types the frontend will show for this system.
extensions: [".gg", ".zip", ".7z"]

emulators:
  default: genesis-plus-gx
  list:
    - id: genesis-plus-gx
      type: libretro
      core: genesis_plus_gx_libretro
      display: "Genesis Plus GX"

bios: []
