# Nintendo 64 - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: n64
name: "Nintendo 64"
short_name: "N64"
manufacturer: "Nintendo"
year: 1996
aliases: []

frontend:
  platform: n64   # scraper/theme id understood by ES-DE and RetroPie
  theme: n64

# File types the frontend will show for this system.
extensions: [".n64", ".v64", ".z64", ".zip"]

emulators:
  default: mupen64plus-next
  list:
    - id: mupen64plus-next
      type: libretro
      core: mupen64plus_next_libretro
      display: "Mupen64Plus-Next"
    - id: parallel-n64
      type: libretro
      core: parallel_n64_libretro
      display: "ParaLLEl N64"
      platforms: [linux]

bios: []

notes: >-
  N64 is demanding; expect per-game tuning. ParaLLEl N64 has Pi-specific
  optimizations.
