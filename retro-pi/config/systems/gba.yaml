# Nintendo Game Boy Advance - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: gba
name: "Nintendo Game Boy Advance"
short_name: "GBA"
manufacturer: "Nintendo"
year: 2001
aliases: []

frontend:
  platform: gba   # scraper/theme id understood by ES-DE and RetroPie
  theme: gba

# File types the frontend will show for this system.
extensions: [".gba", ".zip", ".7z"]

emulators:
  default: mgba
  list:
    - id: mgba
      type: libretro
      core: mgba_libretro
      display: "mGBA"
    - id: vbam
      type: libretro
      core: vbam_libretro
      display: "VBA-M"

# Checked by `retropi doctor --bios`. retro-pi never downloads BIOS files;
# you must supply them from hardware you own.
bios:
  - file: "gba_bios.bin"
    md5: a860e8c0b6d573d191e4ec7db1b1e4f6
    required: false
    note: "Optional; improves compatibility and boot-screen accuracy"

notes: >-
  mGBA is the recommended core. The BIOS is optional but fixes a handful of
  games.
