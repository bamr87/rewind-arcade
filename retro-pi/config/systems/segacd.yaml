# Sega CD / Mega-CD - retro-pi system manifest
# Regenerate frontend entries after editing:  ./bin/retropi build
id: segacd
name: "Sega CD / Mega-CD"
short_name: "Sega CD"
manufacturer: "Sega"
year: 1991
aliases: [megacd]

frontend:
  platform: segacd   # scraper/theme id understood by ES-DE and RetroPie
  theme: segacd

# File types the frontend will show for this system.
extensions: [".cue", ".chd", ".iso", ".bin"]

emulators:
  default: genesis-plus-gx
  list:
    - id: genesis-plus-gx
      type: libretro
      core: genesis_plus_gx_libretro
      display: "Genesis Plus GX"
    - id: picodrive
      type: libretro
      core: picodrive_libretro
      display: "PicoDrive"

# Checked by `retropi doctor --bios`. retro-pi never downloads BIOS files;
# you must supply them from hardware you own.
bios:
  - file: "bios_CD_U.bin"
    md5: 2efd74e3232ff260e371b99f84024f7f
    required: true
    note: "US region BIOS"
  - file: "bios_CD_E.bin"
    md5: e66fa1dc5820d254611fdcdba0662372
    required: false
    note: "EU region BIOS"
  - file: "bios_CD_J.bin"
    md5: 278a9397d192149e84e820ac621a8edd
    required: false
    note: "JP region BIOS"

notes: >-
  Requires a region BIOS in the bios/ directory. Use .chd to keep disc
  images compact.
