# ==============================================================================
# retro-pi - default configuration
# ==============================================================================
# Do not edit this file to customize your setup. Instead run:
#     ./bin/retropi config init
# which creates config/local.yaml (gitignored). Values there override these,
# and any key can also be overridden by an env var:
#     RETROPI_PATHS_ROMS=/Volumes/Games/roms ./bin/retropi build
# ==============================================================================

version: 1

# Human label shown in the frontend and in `retropi doctor`.
profile:
  name: "retro-pi"
  description: "Portable retro gaming workspace"

# ------------------------------------------------------------------ paths ----
# Relative paths resolve against the repo root; absolute paths are used as-is,
# which is how you point at an external SSD or an SMB share.
paths:
  roms: roms
  bios: bios
  saves: saves
  screenshots: screenshots
  themes: themes
  build: build
  downloads: .retropi/downloads

# --------------------------------------------------------------- frontend ----
frontend:
  # es-de             ES-DE (EmulationStation Desktop Edition)  macOS + Linux
  # emulationstation  RetroPie's EmulationStation               Raspberry Pi
  # none              generate config only, launch nothing
  kind: es-de
  theme: slate-es-de
  show_hidden_games: false

  # Write gamelist.xml during `retropi build` so the frontend shows real
  # titles ("The Legend of Zelda") instead of raw filenames. Existing
  # gamelists are merged: scraped descriptions and images are never touched.
  generate_gamelists: true

  # Keys merged into the frontend's es_settings.xml by
  # `retropi frontend settings --apply`. Nothing is written unless you ask.
  # {roms}, {media} and {themes} expand to the resolved paths.
  # Add any key your frontend version supports - none of these are hardcoded.
  settings:
    ROMDirectory: "{roms}"
    MediaDirectory: "{media}"

# -------------------------------------------------------------- emulation ----
emulation:
  # retroarch is the portable backend: one launcher, libretro cores, identical
  # save formats on both platforms. Standalone emulators are opt-in per system.
  backend: retroarch
  # stable | nightly - which libretro buildbot channel to pull cores from.
  core_channel: nightly
  # Applied to generated retroarch launch commands.
  fullscreen: true
  verbose_logging: false
  # Pass retro-pi's paths to RetroArch at launch with --appendconfig instead of
  # editing its own retroarch.cfg. Deterministic across builds that keep their
  # config in different places, and it never overwrites your settings.
  append_config: true

# ---------------------------------------------------------------- systems ----
# The systems `retropi build` generates frontend entries for. Every id must
# have a matching config/systems/<id>.yaml. Trim this list to keep your
# frontend uncluttered - `retropi systems list` shows everything available.
systems:
  enabled:
    - nes
    - snes
    - n64
    - gb
    - gbc
    - gba
    - nds
    - megadrive
    - mastersystem
    - gamegear
    - segacd
    - sega32x
    - saturn
    - dreamcast
    - psx
    - psp
    - atari2600
    - atari7800
    - pcengine
    - neogeo
    - arcade
    - dos
    - c64

# ---------------------------------------------------------------- display ----
display:
  # How the screen is mounted, for `retropi frontend session` (Linux/X11).
  # normal | left | right | inverted  (xrandr names; "left" = 90 deg ccw)
  rotate: normal
  # Part of the (rotated) screen the frontend and games draw in:
  # full | top-half | bottom-half | left-half | right-half
  # Anything but full runs RetroArch in a borderless window of that size
  # instead of fullscreen.
  region: full
  # X display and virtual terminal the session takes over.
  x_display: ":1"
  vt: 7

# ------------------------------------------------------------------ audio ----
audio:
  # Output to play through, matched against the names `retropi audio list`
  # prints (case-insensitive substring), e.g. "hdmi" for speakers fed by the
  # monitor. Empty leaves the system default alone. Applied by `retropi audio
  # apply` and by `frontend session start`. Linux/PipeWire.
  output: ""

# --------------------------------------------------------------- controls ----
controls:
  # Write a shared RetroArch autoconfig + hotkeys so both machines behave alike.
  manage_autoconfig: true
  # RetroArch joypad driver: auto (RetroArch's default) | udev | linuxraw | sdl2
  # linuxraw reads /dev/input/js*, which stays readable when the session was
  # not started from a local login (udev needs /dev/input/event* access).
  joypad_driver: auto
  # Hotkey combos (RetroArch names). "nul" disables a binding.
  hotkey_enable: "select"
  hotkeys:
    exit: "start"
    menu: "x"
    save_state: "r"
    load_state: "l"
    screenshot: "a"
    rewind: "y"

# ------------------------------------------------------------------ saves ----
saves:
  # Keep saves outside the ROM tree so ROMs stay a pure, re-syncable mirror.
  centralize: true
  auto_save_state: false
  rewind_enabled: true

# ------------------------------------------------------------------- sync ----
# Named targets for `retropi sync push <target>`. The Pi is usually the
# destination; a NAS or external drive works the same way.
sync:
  exclude:
    - ".DS_Store"
    - "*.bak.*"
    - "@eaDir"
  targets:
    pi:
      host: retropie.local
      user: pi
      path: "/home/pi/RetroPie"
      # Which content sets to push. roms/bios can be large - they are opt-in.
      include:
        - config
        - roms
        - bios

# ---------------------------------------------------------------- package ----
package:
  # `retropi package` output. Content is never bundled unless you ask.
  include_roms: false
  include_bios: false
  format: tar.gz
