# Unified system registry for Rewind Arcade.
# Human-facing encyclopedia: docs/systems/
# Emulation manifests: emulate/config/systems/<id>.yaml
# Dump identification: catalog/src/cartridge_index/systems/
# Physical/price platforms: catalog/src/cartridge_index/platforms.py
# Browser recreations: arcade/src/games/
#
# ids are shared. A retro-pi ROM folder named roms/<id> is the same id
# cartridge-index uses for dumps, inventory and the price guide.

