[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartridge-index"
version = "0.2.0"
description = "A library and index for a retro game collection, with SQLite analytics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cartidx = "cartridge_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cartridge_index = ["web/*.html", "data/*.csv"]
